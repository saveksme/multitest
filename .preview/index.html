<!doctype html>
<meta charset="utf-8">
<title>multitest — превью сводки</title>
<!-- Onest — шрифт сводки. Картинки вставляем в страницу инлайном: SVG в <img>
     веб-шрифты страницы не видит и подставил бы системный. -->
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  body { background:#1b1b1b; color:#999; font:13px/1.5 system-ui; margin:0; padding:16px 20px 60px }
  h2 { color:#ddd; font-size:14px; font-weight:600; margin:28px 0 8px }
  .page { width:640px; box-shadow:0 0 0 1px #333 }
  .page svg { display:block; width:100%; height:auto }
  .row { display:flex; flex-wrap:wrap; gap:24px; align-items:flex-start }
  code { color:#ddd }
</style>
<p>Ctrl+R после <code>bash .preview/gen.sh</code>. Страницы в половину размера; a — данные макета 5b,
  b — остальные виды страниц, long — одна длинная картинка (MT_ALBUM=0).</p>
<div class="row" id="pages"></div>
<script>
  fetch('out/pages.txt?v=' + Date.now()).then(r => r.text()).then(async list => {
    const root = document.getElementById('pages');
    for (const name of list.split('\n').filter(Boolean)) {
      const box = document.createElement('div');
      box.innerHTML = `<h2>${name}</h2><div class="page"></div>`;
      root.appendChild(box);
      box.querySelector('.page').innerHTML = await (await fetch('out/' + name + '?v=' + Date.now())).text();
    }
  });
</script>
